[project]
name = "scmp-ai-backend"
version = "0.1.0"
description = "SCMP Internal Operations AI Assistant - FastAPI backend (fictional PoC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "httpx",
    "langgraph",
    "google-genai",
    "pyjwt>=2.15.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "app.auth.require_roles",
    "app.auth.dependencies.require_roles",
]
